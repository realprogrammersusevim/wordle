<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Wordle Game</h1>

    <div class="instructions">
        <p>Guess the 5-letter word in 6 tries.</p>
        <div class="color-legend">
            <div class="legend-correct-position"></div><span>Correct letter, correct position.</span>
            <div class="legend-correct-letter"></div><span>Correct letter, wrong position.</span>
            <div class="legend-incorrect-letter"></div><span>Letter not in word.</span>
        </div>
    </div>

    <div class="game-controls">
        <button id="newGameButton">New Game</button>
    </div>

    <div class="guess-input-area">
        <input type="text" id="guessInput" maxlength="5" placeholder="Enter guess">
        <button id="submitGuessButton">Submit Guess</button>
    </div>

    <div id="guessesContainer">
        <!-- Guess rows will be generated by JavaScript -->
    </div>

    <p id="messageArea"></p>
    <p>Possible words remaining: <span id="remainingWords"></span></p>
    <div id="suggestionsArea">
        <!-- Suggestions will be populated by JavaScript -->
    </div>

    <script>
        const guessInputEl = document.getElementById('guessInput');
        const submitGuessButtonEl = document.getElementById('submitGuessButton');
        const newGameButtonEl = document.getElementById('newGameButton');
        const guessesContainerEl = document.getElementById('guessesContainer');
        const messageAreaEl = document.getElementById('messageArea');
        const remainingWordsEl = document.getElementById('remainingWords');
        const suggestionsAreaEl = document.getElementById('suggestionsArea');

        let currentRow = 0;
        const MAX_GUESSES = 6;
        const WORD_LENGTH = 5;

        function initializeBoard() {
            guessesContainerEl.innerHTML = ''; // Clear previous board
            for (let i = 0; i < MAX_GUESSES; i++) {
                const row = document.createElement('div');
                row.className = 'guess-row';
                for (let j = 0; j < WORD_LENGTH; j++) {
                    const box = document.createElement('div');
                    box.className = 'letter-box';
                    row.appendChild(box);
                }
                guessesContainerEl.appendChild(row);
            }
        }

        async function startGame() {
            currentRow = 0;
            initializeBoard();
            messageAreaEl.textContent = '';
            suggestionsAreaEl.innerHTML = '';
            guessInputEl.value = '';
            remainingWordsEl.textContent = '';
            guessInputEl.disabled = false;
            submitGuessButtonEl.disabled = false;

            try {
                const response = await fetch('/game/start', { method: 'POST' });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ detail: "Failed to start game. Network error." }));
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                remainingWordsEl.textContent = data.possible_words_count;
                if (data.suggestions && data.suggestions.length > 0) {
                    renderSuggestions(data.suggestions);
                }
                messageAreaEl.textContent = data.message || "Game started. Make your guess!";
            } catch (error) {
                messageAreaEl.textContent = `Error starting game: ${error.message}`;
                console.error("Error starting game:", error);
                guessInputEl.disabled = true;
                submitGuessButtonEl.disabled = true;
            }
        }

        async function submitGuess() {
            const guessWord = guessInputEl.value.toLowerCase();

            if (guessWord.length !== WORD_LENGTH) {
                messageAreaEl.textContent = `Guess must be ${WORD_LENGTH} letters long.`;
                return;
            }
            
            // Disable input while processing
            guessInputEl.disabled = true;
            submitGuessButtonEl.disabled = true;
            messageAreaEl.textContent = 'Processing guess...';


            try {
                const response = await fetch('/game/guess', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ guess: guessWord }),
                });

                if (!response.ok) {
                     const errorData = await response.json().catch(() => ({ detail: "Invalid guess or server error." }));
                     throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Update UI based on response
                updateBoardWithFeedback(data.guess_feedback, guessWord);
                remainingWordsEl.textContent = data.possible_words_count;
                
                if (data.suggestions && data.suggestions.length > 0) {
                    renderSuggestions(data.suggestions);
                } else {
                    suggestionsAreaEl.innerHTML = ''; // Clear suggestions if none
                }

                if (data.message) {
                    messageAreaEl.textContent = data.message;
                }

                if (data.game_won) {
                    messageAreaEl.textContent = "Congratulations! You guessed the word!";
                    disableGameControls();
                } else if (currentRow >= MAX_GUESSES -1 ) { // Check if it was the last row
                     messageAreaEl.textContent = "You lose! Better luck next time."; // Backend doesn't send secret word
                     disableGameControls();
                } else {
                    currentRow++;
                    guessInputEl.value = ''; // Clear input for next guess
                    guessInputEl.disabled = false; // Re-enable for next guess
                    submitGuessButtonEl.disabled = false;
                    guessInputEl.focus();
                }

            } catch (error) {
                messageAreaEl.textContent = `Error submitting guess: ${error.message}`;
                console.error("Error submitting guess:", error);
                // Re-enable input if there was an error not related to game ending
                if (currentRow < MAX_GUESSES) {
                    guessInputEl.disabled = false;
                    submitGuessButtonEl.disabled = false;
                }
            }
        }

        function updateBoardWithFeedback(feedback, guessWord) {
            if (currentRow >= MAX_GUESSES) return; // Should not happen if logic is correct

            const row = guessesContainerEl.children[currentRow];
            if (!row) {
                console.error("Current row element not found in DOM for row index:", currentRow);
                return;
            }

            for (let i = 0; i < WORD_LENGTH; i++) {
                const box = row.children[i];
                if (!box) {
                    console.error(`Letter box element not found for letter index: ${i} in row: ${currentRow}`);
                    continue;
                }
                box.textContent = guessWord[i].toUpperCase();
                // Remove previous state classes
                box.classList.remove('correct-position', 'in-word-wrong-position', 'not-in-word');

                if (feedback && feedback[i]) {
                    switch (feedback[i].state) {
                        case 'in_word_correct_position':
                            box.classList.add('correct-position');
                            break;
                        case 'in_word_wrong_position':
                            box.classList.add('in-word-wrong-position');
                            break;
                        case 'not_in_word':
                            box.classList.add('not-in-word');
                            break;
                        default:
                            // Keep default styling if state is unknown
                            break; 
                    }
                } else {
                    // Fallback if feedback is incomplete, though this shouldn't happen with a valid backend response
                    box.classList.add('not-in-word'); // Or some other default error indicator
                }
            }
        }
        
        function renderSuggestions(suggestions) {
            suggestionsAreaEl.innerHTML = 'Suggestions: ';
            suggestions.forEach(word => {
                const button = document.createElement('button');
                button.textContent = word;
                button.onclick = () => {
                    guessInputEl.value = word;
                    submitGuess(); // Optionally auto-submit or just fill
                };
                suggestionsAreaEl.appendChild(button);
            });
        }

        function disableGameControls() {
            guessInputEl.disabled = true;
            submitGuessButtonEl.disabled = true;
        }

        // Event Listeners
        newGameButtonEl.addEventListener('click', startGame);
        submitGuessButtonEl.addEventListener('click', submitGuess);
        guessInputEl.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault(); // Prevent form submission if it were in a form
                submitGuess();
            }
        });

        // Initial game setup
        startGame(); // Start the game automatically when the page loads
    </script>
</body>
</html>
